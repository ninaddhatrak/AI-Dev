version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: harm-tracker-postgres
    environment:
      POSTGRES_DB: harm_tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker_pw
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d harm_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumen-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: harm_tracker
      DB_USER: tracker
      DB_PASSWORD: tracker_pw
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
