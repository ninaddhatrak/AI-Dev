<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Harm Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">&#9888;</span>
      <span class="logo-text">Harm Tracker</span>
    </div>
    <ul class="nav-links">
      <li><a href="#overview"  class="nav-link active" data-view="overview">Overview</a></li>
      <li><a href="#channels"  class="nav-link"        data-view="channels">Channels</a></li>
      <li><a href="#network"   class="nav-link"        data-view="network">Network</a></li>
      <li><a href="#messages"  class="nav-link"        data-view="messages">Messages</a></li>
    </ul>
  </nav>

  <main class="main-content">
    <div id="view-overview"  class="view active"></div>
    <div id="view-channels"  class="view"></div>
    <div id="view-network"   class="view"></div>
    <div id="view-messages"  class="view"></div>
  </main>

  <!-- D3 v7 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
